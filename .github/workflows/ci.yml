name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked dependencies
        run: >-
          python -m pip install
          --requirement requirements.lock
          --requirement serverless_function/requirements.txt
      - name: Run unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}
        run: python -m unittest discover -s tests -v
      - name: Run deterministic smoke simulation
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m vehicular_offloading simulate --config configs/smoke.toml
