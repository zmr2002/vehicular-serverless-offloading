[simulation]
steps = 2000
vehicle_count = 2000
seed = 42
task_probability = 0.6
strategy = "hybrid_stackelberg"
decision_timing = "synchronous_batch"
backend = "analytical"
mobility = "sumo"
output_dir = "results/verified"
minimum_free_disk_gb = 12.0
scenario_net = "scenarios/wakaba/wakaba.net.xml"
route_output_dir = "scenarios/wakaba/generated"
route_departure_end_s = 2000.0
sumo_binary = "sumo"
vehicle_compute_hz = 2.0e9
service_compute_hz = 2.0e9
cloud_compute_hz = 5.0e10
cloud_base_price = 0.1
cloud_pricing_mode = "follower_best_response"
cloud_target_offload_ratio = 0.3
cloud_demand_sensitivity = 3.0
cloud_price_smoothing = 0.1
cloud_min_price = 0.05
cloud_max_price = 1.0
cloud_capacity_price_weight = 1.0
cloud_price_candidate_count = 7
cloud_price_response_temperature = 0.15
cloud_price_response_iterations = 3
cloud_price_response_min_iterations = 1
cloud_price_response_relaxation = 0.5
cloud_price_response_tolerance = 0.0
cloud_price_response_policy = "softmax"
# Preserve the final-v1 demand predictor for controlled comparisons. The
# corrected profile enables full state consistency explicitly.
cloud_price_state_consistency = false
cloud_price_batch_candidates = true
cloud_price_outer_iterations = 2
cloud_price_outer_min_iterations = 2
cloud_price_outer_tolerance = 0.0
cloud_leader_timeout_weight = 0.5
cloud_leader_late_tolerance = 0.02
service_price_sensitivity = 0.5
service_demand_price_weight = 0.15
service_min_energy = 0.05
service_max_queue = 5
service_role_mode = "dynamic_idle"
service_vehicle_ratio = 0.3
vehicle_battery_capacity_j = 1.0e6
service_vehicle_battery_capacity_j = 1.0e6
task_compute_distribution = "uniform"
task_compute_min_cycles = 1.0e9
task_compute_max_cycles = 5.0e9
task_compute_choices = [1.0e9, 5.0e9]
task_data_min_mb = 1.0
task_data_max_mb = 100.0
task_deadline_distribution = "uniform"
task_deadline_min_s = 2.0
task_deadline_max_s = 3.0
task_deadlines_s = [0.8, 1.5, 2.0]
service_positions = [[1299.83, 1777.63], [1629.12, 504.58], [1668.84, 2145.74], [1756.9, 1777.77], [2102.72, 2000.51], [2145.38, 1640.63]]

[dqn]
state_size = 20
action_size = 3
hidden_sizes = [256, 128]
replay_capacity = 10000
replay_sampling = "load_stratified"
batch_size = 64
learning_rate = 0.0005
gamma = 0.9
epsilon_start = 1.0
epsilon_end = 0.05
epsilon_decay = 0.9998
target_update_interval = 250
warmup_transitions = 512
training_interval = 32
gradient_clip_norm = 10.0
huber_delta = 1.0
game_guidance_weight = 0.05
game_guidance_margin = 0.1
intraop_threads = 1
interop_threads = 1
device = "cpu"

[decision]
delay_weight = 1.0
energy_weight = 0.2
payment_weight = 0.075
energy_scale_j = 250.0
payment_scale = 0.5
hybrid_residual_weight = 0.75
hybrid_fusion_mode = "adaptive_confidence"
hybrid_residual_congestion_adaptation = false
hybrid_residual_decay_start_ratio = 0.5
hybrid_residual_min_scale = 0.2
deadline_action_masking = true
